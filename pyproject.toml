[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sipscout"
version = "0.1.0"
description = "AI discovery engine for SIP continuation research"
requires-python = ">=3.11"
dependencies = [
  "google-play-scraper>=1.2.7",
  "httpx>=0.27",
  "praw>=7.7",
  "google-api-python-client>=2.130",
  "openai>=1.40",
  "pandas>=2.2",
  "pyarrow>=16",
  "typer>=0.12",
  "rich>=13.7",
  "pydantic>=2.7",
  "tenacity>=8.3",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
  "langdetect>=1.0.9",
  "streamlit>=1.36",
  "plotly>=5.22",
]

[project.optional-dependencies]
analysis = [
  "sentence-transformers>=3.0",
  "umap-learn>=0.5.6",
  "hdbscan>=0.8.36",
]
dev = ["pytest>=8.2"]

[project.scripts]
sipscout = "sipscout.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
